version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "weekly"
      time: "07:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 7
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      fullcalendar:
        patterns:
          - "@fullcalendar/*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: "weekly"
      time: "07:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 7